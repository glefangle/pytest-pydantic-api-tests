name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy src tests

  tests:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

      - name: Restore Allure history from gh-pages
        if: always()
        run: |
          git clone --single-branch --branch gh-pages \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            allure-history || echo "gh-pages not found yet, starting fresh"

      - name: Install Allure CLI
        if: always()
        run: |
          curl -sL -o "$RUNNER_TEMP/allure.tgz" \
            https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-2.32.0/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report with history
        if: always()
        run: |
          RUN_NO="${{ github.run_number }}"
          mkdir -p allure-results/history allure-history
          if [ -d allure-history/history ]; then
            cp -r allure-history/history/. allure-results/history/
          fi
          allure generate allure-results -o "allure-history/$RUN_NO" --clean
          ls allure-history | grep -E '^[0-9]+$' | sort -n | head -n -19 \
            | xargs -r -I{} rm -rf "allure-history/{}" || true
          rm -rf allure-history/history
          cp -r "allure-history/$RUN_NO/history" allure-history/history
          printf '<meta http-equiv="refresh" content="0;url=%s">\n' "$RUN_NO" > allure-history/index.html

      - name: Publish report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
